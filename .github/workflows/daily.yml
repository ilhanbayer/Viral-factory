name: Gunluk viral video

on:
  push:
    branches: [main]
    paths:
      - "topics/queue/**"
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "47 15 * * *"      # her gün 18:47 (Türkiye saati)
  workflow_dispatch:
    inputs:
      count:
        description: "Kaç video?"
        default: "1"

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Video üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VOICE_ENGINE: ${{ vars.VOICE_ENGINE || 'edge' }}
          VOICE_NAME: ${{ vars.VOICE_NAME || 'ahmet' }}
        run: python run.py --count ${{ github.event.inputs.count || '1' }} --upload
      - uses: actions/upload-artifact@v4
        with:
          name: videolar-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.srt
            output/*.jpg
            output/*_metadata.txt
          retention-days: 30
      - name: Videoyu Releases'a koy (iPad'den kolay izleme/indirme)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in output/*.mp4; do
            id=$(basename "$f" .mp4)
            gh release create "video-${{ github.run_number }}-$id" "$f" "output/${id}_kapak.jpg" "output/${id}.srt" \
              --title "$(head -n1 output/${id}_metadata.txt)" --notes-file "output/${id}_metadata.txt"
          done
      - name: Kuyruğu kaydet
        run: |
          git config user.name "viral-factory-bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics
          git diff --cached --quiet || git commit -m "Konu kuyruğu güncellendi"
          git push
