name: Harita verisi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u tools/geo_fetch.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/geo
          git commit -m "Harita verisi (Natural Earth + TR iller) [skip ci]" || true
          git pull --rebase
          git push
