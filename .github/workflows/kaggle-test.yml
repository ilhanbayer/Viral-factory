name: Kaggle cizgi film testi

on:
  push:
    branches: [main]
    paths: ["kaggle/**", ".github/workflows/kaggle-test.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U kaggle
      - name: Kaggle GPU'da çalıştır
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || vars.KAGGLE_USERNAME }}
        run: python -u kaggle/kaggle_run.py kaggle/cartoon_test vf-cartoon-test kout 300
      - name: Yayınla
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(kout/*.jpg kout/*.mp4 kout/log.txt)
          [ ${#files[@]} -eq 0 ] && exit 0
          gh release delete kaggle-test -y --cleanup-tag || true
          gh release create kaggle-test "${files[@]}" --title "Kaggle çizgi film testi (dahili)" --notes "Kaggle GPU testi" --prerelease
